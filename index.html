<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sticker Maker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: #0a0a0a;
    color: #e8e8e8;
    display: flex;
    min-height: 100vh;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  aside {
    width: 280px;
    background: #111;
    border-right: 1px solid #1f1f1f;
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    overflow-y: auto;
  }
  .brand {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 22px;
    letter-spacing: -0.02em;
    color: #fff;
  }
  .brand span { color: #f0c14b; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: #666;
  }
  button, label.file-btn {
    font: inherit;
    font-size: 12px;
    background: #181818;
    color: #ddd;
    border: 1px solid #242424;
    padding: 9px 12px;
    border-radius: 2px;
    cursor: pointer;
    text-align: left;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  button:hover, label.file-btn:hover { background: #1f1f1f; border-color: #333; color: #fff; }
  button.primary {
    background: #f0c14b;
    border-color: #f0c14b;
    color: #111;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
    font-size: 11px;
  }
  button.primary:hover { background: #ffd666; border-color: #ffd666; }
  button.ghost { text-align: center; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #888; }
  button.ghost:hover { color: #fff; }
  input[type="color"] {
    width: 100%; height: 38px;
    border: 1px solid #242424; border-radius: 2px;
    background: #181818; cursor: pointer; padding: 2px;
  }
  input[type="text"], input[type="email"] {
    width: 100%; padding: 9px 12px;
    border-radius: 2px;
    background: #181818; color: #ddd;
    border: 1px solid #242424;
    font: inherit; font-size: 12px;
  }
  input:focus { outline: none; border-color: #f0c14b; }
  .templates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .templates button {
    padding: 6px; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    background: #181818;
  }
  .templates svg { width: 100%; height: 100%; }
  hr { border: none; border-top: 1px solid #1a1a1a; margin: 0; }
  main {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px; gap: 20px;
    background:
      radial-gradient(circle at 50% 30%, #141414 0%, #0a0a0a 70%);
  }
  .canvas-wrap {
    padding: 12px;
    background: #0d0d0d;
    border: 1px solid #1f1f1f;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  canvas { display: block; cursor: grab; background: #fff; }
  canvas:active { cursor: grabbing; }
  .hint {
    font-size: 11px;
    color: #555;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
  }
  .hint b { color: #888; font-weight: 600; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0a0a0a; }
  ::-webkit-scrollbar-thumb { background: #222; }
</style>
</head>
<body>

<aside>
  <div class="brand">Sticker<span>.</span>Maker</div>

  <div class="group">
    <div class="label">Background</div>
    <input type="color" id="bgColor" value="#fef3c7" />
  </div>

  <div class="group">
    <div class="label">Add</div>
    <label class="file-btn" for="upload">Upload image</label>
    <input id="upload" type="file" accept="image/*" hidden />
    <div class="templates" id="templates"></div>
  </div>

  <hr />

  <div class="group">
    <button id="duplicateBtn" class="ghost">Duplicate</button>
    <button id="deleteBtn" class="ghost">Delete</button>
    <button id="clearBtn" class="ghost">Clear all</button>
  </div>

  <hr />

  <div class="group">
    <div class="label">Export</div>
    <button id="exportCombined">Combined</button>
    <button id="exportWhite">Stickers on white</button>
    <button id="exportBg">Background only</button>
    <button id="exportAll" class="primary">Export all three</button>
  </div>

  <hr />

  <div class="group">
    <div class="label">Send to be created</div>
    <input id="customerEmail" type="email" placeholder="your@email" />
    <input id="notes" type="text" placeholder="notes" />
    <button id="sendBtn" class="primary">Send design</button>
  </div>
</aside>

<main>
  <div class="canvas-wrap">
    <canvas id="canvas" width="700" height="700"></canvas>
  </div>
  <div class="hint"><b>Drag</b> move · <b>Handles</b> resize · <b>Top circle</b> rotate</div>
</main>

<script>
(() => {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  let stickers = [];
  let selectedId = null;
  let bgColor = document.getElementById("bgColor").value;

  let mode = null;
  let dragStart = null;

  const HANDLE_RADIUS = 8;
  const ROTATE_OFFSET = 36;

  const TEMPLATES = {
    star: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50,5 61,38 96,38 68,59 79,92 50,71 21,92 32,59 4,38 39,38" fill="#facc15" stroke="#a16207" stroke-width="3"/></svg>`,
    heart: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50,88 C20,68 5,50 5,32 C5,18 16,8 28,8 C37,8 45,13 50,21 C55,13 63,8 72,8 C84,8 95,18 95,32 C95,50 80,68 50,88 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/></svg>`,
    cat: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M25,20 L35,40 L65,40 L75,20 L85,45 C88,60 82,80 50,80 C18,80 12,60 15,45 Z" fill="#f59e0b" stroke="#78350f" stroke-width="3"/><circle cx="38" cy="55" r="4" fill="#111"/><circle cx="62" cy="55" r="4" fill="#111"/><path d="M45,68 Q50,73 55,68" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`,
    smiley: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#fde047" stroke="#854d0e" stroke-width="3"/><circle cx="37" cy="42" r="5" fill="#111"/><circle cx="63" cy="42" r="5" fill="#111"/><path d="M32,62 Q50,80 68,62" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`,
    cloud: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M25,70 C10,70 5,55 18,47 C18,30 40,25 50,38 C58,25 82,28 82,48 C95,50 95,70 80,70 Z" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/></svg>`,
    bolt: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="55,5 20,55 45,55 40,95 80,40 55,40" fill="#a855f7" stroke="#4c1d95" stroke-width="3"/></svg>`,
  };

  const templatesEl = document.getElementById("templates");
  Object.entries(TEMPLATES).forEach(([name, svg]) => {
    const btn = document.createElement("button");
    btn.title = name;
    btn.innerHTML = svg;
    btn.addEventListener("click", () => addSvgTemplate(svg));
    templatesEl.appendChild(btn);
  });

  const uid = () => Math.random().toString(36).slice(2, 10);

  function addSvgTemplate(svg) {
    const blob = new Blob([svg], { type: "image/svg+xml" });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const size = 150;
      const s = {
        id: uid(), img,
        x: W / 2 - size / 2 + (Math.random() * 60 - 30),
        y: H / 2 - size / 2 + (Math.random() * 60 - 30),
        w: size, h: size, rot: 0,
      };
      stickers.push(s);
      selectedId = s.id;
      draw();
    };
    img.src = url;
  }

  function addImageFromFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 200;
        let w = img.naturalWidth;
        let h = img.naturalHeight;
        const scale = Math.min(1, max / Math.max(w, h));
        w *= scale; h *= scale;
        const s = { id: uid(), img, x: W / 2 - w / 2, y: H / 2 - h / 2, w, h, rot: 0 };
        stickers.push(s);
        selectedId = s.id;
        draw();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function rotPoint(x, y, cx, cy, angle) {
    const cos = Math.cos(angle), sin = Math.sin(angle);
    const dx = x - cx, dy = y - cy;
    return [cx + dx * cos - dy * sin, cy + dx * sin + dy * cos];
  }

  function getHandles(s) {
    const cx = s.x + s.w / 2;
    const cy = s.y + s.h / 2;
    const corners = [
      [s.x, s.y],
      [s.x + s.w, s.y],
      [s.x + s.w, s.y + s.h],
      [s.x, s.y + s.h],
    ];
    const rotatedCorners = corners.map(([x, y]) => rotPoint(x, y, cx, cy, s.rot));
    const rotateHandle = rotPoint(cx, cy - ROTATE_OFFSET - s.h / 2, cx, cy, s.rot);
    return { rotatedCorners, rotateHandle };
  }

  function pointInSticker(s, px, py) {
    const cx = s.x + s.w / 2;
    const cy = s.y + s.h / 2;
    const [lx, ly] = rotPoint(px, py, cx, cy, -s.rot);
    return lx >= s.x && lx <= s.x + s.w && ly >= s.y && ly <= s.y + s.h;
  }

  function draw() {
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, W, H);

    for (const s of stickers) {
      ctx.save();
      ctx.translate(s.x + s.w / 2, s.y + s.h / 2);
      ctx.rotate(s.rot);
      ctx.drawImage(s.img, -s.w / 2, -s.h / 2, s.w, s.h);
      ctx.restore();
    }

    const sel = stickers.find((s) => s.id === selectedId);
    if (sel) {
      const { rotatedCorners, rotateHandle } = getHandles(sel);
      ctx.save();
      ctx.strokeStyle = "#f0c14b";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(...rotatedCorners[0]);
      for (let i = 1; i < 4; i++) ctx.lineTo(...rotatedCorners[i]);
      ctx.closePath();
      ctx.stroke();

      ctx.fillStyle = "#fff";
      for (const [x, y] of rotatedCorners) {
        ctx.beginPath();
        ctx.arc(x, y, HANDLE_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      const cx = sel.x + sel.w / 2;
      const cy = sel.y + sel.h / 2;
      const topMid = rotPoint(cx, sel.y, cx, cy, sel.rot);
      ctx.beginPath();
      ctx.moveTo(...topMid);
      ctx.lineTo(...rotateHandle);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(...rotateHandle, HANDLE_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = "#f0c14b";
      ctx.fill();
      ctx.strokeStyle = "#111";
      ctx.stroke();
      ctx.restore();
    }
  }

  function getPointer(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - r.left) / r.width) * canvas.width,
      y: ((e.clientY - r.top) / r.height) * canvas.height,
    };
  }

  function hitTest(px, py) {
    for (let i = stickers.length - 1; i >= 0; i--) {
      const s = stickers[i];
      const { rotatedCorners, rotateHandle } = getHandles(s);
      if (Math.hypot(px - rotateHandle[0], py - rotateHandle[1]) <= HANDLE_RADIUS + 4)
        return { s, mode: "rotate" };
      for (const [cx, cy] of rotatedCorners) {
        if (Math.hypot(px - cx, py - cy) <= HANDLE_RADIUS + 4)
          return { s, mode: "resize" };
      }
      if (pointInSticker(s, px, py)) return { s, mode: "move" };
    }
    return null;
  }

  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    const p = getPointer(e);
    const hit = hitTest(p.x, p.y);

    if (!hit) { selectedId = null; draw(); return; }

    selectedId = hit.s.id;
    mode = hit.mode;
    const s = hit.s;
    const cx = s.x + s.w / 2;
    const cy = s.y + s.h / 2;

    dragStart = {
      pointer: p,
      start: { ...s },
      center: { x: cx, y: cy },
      startAngle: Math.atan2(p.y - cy, p.x - cx),
    };

    stickers = stickers.filter((x) => x.id !== s.id);
    stickers.push(s);
    draw();
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!mode || !dragStart) return;
    const p = getPointer(e);
    const s = stickers.find((x) => x.id === selectedId);
    if (!s) return;

    if (mode === "move") {
      s.x = dragStart.start.x + (p.x - dragStart.pointer.x);
      s.y = dragStart.start.y + (p.y - dragStart.pointer.y);
    } else if (mode === "resize") {
      const cx = dragStart.center.x;
      const cy = dragStart.center.y;
      const [lx, ly] = rotPoint(p.x, p.y, cx, cy, -s.rot);
      const origX = dragStart.start.x;
      const origY = dragStart.start.y;
      const origW = dragStart.start.w;
      const origH = dragStart.start.h;

      const corners = [
        { x: origX, y: origY, dx: 0, dy: 0 },
        { x: origX + origW, y: origY, dx: 1, dy: 0 },
        { x: origX + origW, y: origY + origH, dx: 1, dy: 1 },
        { x: origX, y: origY + origH, dx: 0, dy: 1 },
      ];
      let nearest = corners[0], best = Infinity;
      for (const c of corners) {
        const d = (c.x - lx) ** 2 + (c.y - ly) ** 2;
        if (d < best) { best = d; nearest = c; }
      }
      const fixedX = nearest.dx === 0 ? origX + origW : origX;
      const fixedY = nearest.dy === 0 ? origY + origH : origY;
      let newW = Math.abs(lx - fixedX);
      let newH = Math.abs(ly - fixedY);
      const aspect = origW / origH;
      if (newW / newH > aspect) newH = newW / aspect;
      else newW = newH * aspect;
      newW = Math.max(20, newW);
      newH = Math.max(20, newH);
      s.x = nearest.dx === 0 ? fixedX - newW : fixedX;
      s.y = nearest.dy === 0 ? fixedY - newH : fixedY;
      s.w = newW; s.h = newH;
    } else if (mode === "rotate") {
      const cx = dragStart.center.x;
      const cy = dragStart.center.y;
      const angle = Math.atan2(p.y - cy, p.x - cx);
      s.rot = dragStart.start.rot + (angle - dragStart.startAngle);
      s.x = cx - s.w / 2;
      s.y = cy - s.h / 2;
    }
    draw();
  });

  canvas.addEventListener("pointerup", (e) => {
    mode = null;
    dragStart = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch {}
  });

  document.addEventListener("keydown", (e) => {
    if ((e.key === "Delete" || e.key === "Backspace") && document.activeElement === document.body) {
      if (selectedId) {
        stickers = stickers.filter((s) => s.id !== selectedId);
        selectedId = null;
        draw();
        e.preventDefault();
      }
    }
    if ((e.ctrlKey || e.metaKey) && e.key === "d") {
      e.preventDefault();
      duplicateSelected();
    }
  });

  function duplicateSelected() {
    const s = stickers.find((x) => x.id === selectedId);
    if (!s) return;
    const copy = { ...s, id: uid(), x: s.x + 20, y: s.y + 20 };
    stickers.push(copy);
    selectedId = copy.id;
    draw();
  }

  function exportCanvas({ includeBg, includeStickers, forceWhiteBg, filename }) {
    const off = document.createElement("canvas");
    off.width = W; off.height = H;
    const o = off.getContext("2d");

    if (includeBg) {
      o.fillStyle = forceWhiteBg ? "#ffffff" : bgColor;
      o.fillRect(0, 0, W, H);
    }
    if (includeStickers) {
      for (const s of stickers) {
        o.save();
        o.translate(s.x + s.w / 2, s.y + s.h / 2);
        o.rotate(s.rot);
        o.drawImage(s.img, -s.w / 2, -s.h / 2, s.w, s.h);
        o.restore();
      }
    }
    off.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, "image/png");
  }

  document.getElementById("exportCombined").addEventListener("click", () =>
    exportCanvas({ includeBg: true, includeStickers: true, filename: "design-combined.png" }));

  document.getElementById("exportWhite").addEventListener("click", () =>
    exportCanvas({ includeBg: true, includeStickers: true, forceWhiteBg: true, filename: "design-stickers-white.png" }));

  document.getElementById("exportBg").addEventListener("click", () =>
    exportCanvas({ includeBg: true, includeStickers: false, filename: "design-background.png" }));

  document.getElementById("exportAll").addEventListener("click", () => {
    exportCanvas({ includeBg: true, includeStickers: true, filename: "design-combined.png" });
    setTimeout(() => exportCanvas({ includeBg: true, includeStickers: true, forceWhiteBg: true, filename: "design-stickers-white.png" }), 300);
    setTimeout(() => exportCanvas({ includeBg: true, includeStickers: false, filename: "design-background.png" }), 600);
  });

  document.getElementById("sendBtn").addEventListener("click", () => {
    const customerEmail = document.getElementById("customerEmail").value.trim();
    const notes = document.getElementById("notes").value.trim();

    const off = document.createElement("canvas");
    const PREVIEW = 400;
    off.width = PREVIEW; off.height = PREVIEW;
    const o = off.getContext("2d");
    o.fillStyle = bgColor; o.fillRect(0, 0, PREVIEW, PREVIEW);
    const scale = PREVIEW / W;
    for (const s of stickers) {
      o.save();
      o.translate((s.x + s.w / 2) * scale, (s.y + s.h / 2) * scale);
      o.rotate(s.rot);
      o.drawImage(s.img, -s.w * scale / 2, -s.h * scale / 2, s.w * scale, s.h * scale);
      o.restore();
    }
    const previewDataUrl = off.toDataURL("image/png");

    const payload = {
      submittedAt: new Date().toISOString(),
      customerEmail: customerEmail || null,
      notes: notes || null,
      bgColor,
      canvas: { width: W, height: H },
      stickers: stickers.map((s) => ({
        x: s.x, y: s.y, w: s.w, h: s.h, rot: s.rot,
        src: s.img.src,
      })),
    };

    const jsonBlob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const dlJson = document.createElement("a");
    dlJson.href = URL.createObjectURL(jsonBlob);
    dlJson.download = "design.json";
    dlJson.click();

    setTimeout(() => {
      const dlPng = document.createElement("a");
      dlPng.href = previewDataUrl;
      dlPng.download = "design-preview.png";
      dlPng.click();
    }, 200);

    const yourEmail = "you@example.com";
    const subject = encodeURIComponent("New sticker pack design");
    const body = encodeURIComponent(
      `Hi,\n\nI'd like to have this sticker pack created.\n\n` +
      `Background color: ${bgColor}\n` +
      `Number of stickers: ${stickers.length}\n` +
      `My email: ${customerEmail || "(not provided)"}\n` +
      `Notes: ${notes || "(none)"}\n\n` +
      `Attaching design-preview.png and design.json.\n\nThanks!`
    );
    window.location.href = `mailto:${yourEmail}?subject=${subject}&body=${body}`;
  });

  document.getElementById("bgColor").addEventListener("input", (e) => {
    bgColor = e.target.value;
    draw();
  });

  document.getElementById("upload").addEventListener("change", (e) => {
    const file = e.target.files?.[0];
    if (file) addImageFromFile(file);
    e.target.value = "";
  });

  document.getElementById("duplicateBtn").addEventListener("click", duplicateSelected);
  document.getElementById("deleteBtn").addEventListener("click", () => {
    if (!selectedId) return;
    stickers = stickers.filter((s) => s.id !== selectedId);
    selectedId = null;
    draw();
  });
  document.getElementById("clearBtn").addEventListener("click", () => {
    if (stickers.length && !confirm("Remove all stickers?")) return;
    stickers = [];
    selectedId = null;
    draw();
  });

  addSvgTemplate(TEMPLATES.star);
  selectedId = null;
  draw();
})();
</script>
</body>
</html>
